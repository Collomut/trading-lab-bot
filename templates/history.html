<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Trades · Trading Lab</title><link rel="stylesheet" href="/assets/app.css?v=m2"><script src="/assets/app.js" defer></script></head><body><nav><div class="nav-inner"><a class="brand" href="/">TRADING LAB</a><div class="nav-links"><a class="nav-link" href="/">Overview</a><a class="nav-link" href="/positions">Positions</a><a class="nav-link active" href="/history">Trades</a><a class="nav-link" href="/strategy">Strategy</a><a class="nav-link" href="/logs">Logs</a><a class="nav-link" href="/terms">Glossary</a></div><button class="theme-toggle" type="button" data-theme-toggle aria-label="Switch to dark mode"><span aria-hidden="true">◐</span><span data-theme-label>Dark mode</span></button></div></nav><main class="container"><header class="page-head"><div><div class="eyebrow">Activity</div><h1>Closed trades</h1></div><div class="status"><span id="dot" class="dot"></span><span id="state">Loading…</span></div></header><div class="grid" style="margin:12px 0"><section class="card metric-card"><div class="metric-label">Closed trades</div><div class="metric" id="count">—</div></section><section class="card metric-card"><div class="metric-label">Win / loss</div><div class="metric" id="wins">—</div></section><section class="card metric-card"><div class="metric-label">Reconciled P&amp;L</div><div class="metric" id="sum">—</div></section></div><div id="history" class="table-wrap"><div class="empty">Loading…</div></div><footer>Reconciled P&amp;L accounts for recorded order execution fees. Verify fills with the exchange. <a href="/terms#pnl">P&amp;L definitions</a></footer></main><script>
const money=v=>'$'+Number(v||0).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});function addCell(row,v,cls=''){const td=document.createElement('td');td.textContent=v;if(cls)td.className=cls;row.append(td)}async function refresh(){try{const r=await fetch('/api/status',{cache:'no-store'});if(!r.ok)throw Error(`Status unavailable (${r.status})`);const d=await r.json(),sells=(d.trades||[]).filter(t=>t.action==='SELL'),wins=sells.filter(t=>Number(t.pnl)>0).length,losses=sells.length-wins,total=sells.reduce((n,t)=>n+Number(t.pnl||0),0);document.getElementById('count').textContent=sells.length;document.getElementById('wins').textContent=`${wins} / ${losses}`;const sum=document.getElementById('sum');sum.textContent=money(total);sum.className='metric '+(total>0?'positive':total<0?'negative':'');const wrap=document.getElementById('history');wrap.replaceChildren();if(!sells.length){const p=document.createElement('div');p.className='empty';p.textContent='No closed trades recorded';wrap.append(p)}else{const t=document.createElement('table'),h=t.createTHead().insertRow();['Time (UTC)','Pair','Exit','P&L','Reason'].forEach(x=>{const th=document.createElement('th');th.textContent=x;h.append(th)});const b=t.createTBody();for(const trade of [...sells].reverse()){const row=b.insertRow();addCell(row,(trade.timestamp||'').replace('T',' ').slice(0,19));addCell(row,trade.symbol||'—');addCell(row,money(trade.price));addCell(row,money(trade.pnl),trade.pnl>0?'positive':trade.pnl<0?'negative':'');addCell(row,trade.reason||'—')}wrap.append(t)}document.getElementById('state').textContent=`${new Date().toLocaleTimeString()}`;document.getElementById('dot').className='dot ok'}catch(e){document.getElementById('state').textContent=e.message;document.getElementById('dot').className='dot bad'}}refresh();setInterval(refresh,15000);
</script></body></html>
